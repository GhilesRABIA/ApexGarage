<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ApexGarage</title>
</head>
<body>
<style>
@font-face{font-family:'Barlow Condensed';font-weight:500;font-style:normal;font-display:swap;src:url('fonts/barlow-condensed-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;font-style:normal;font-display:swap;src:url('fonts/barlow-condensed-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-style:normal;font-display:swap;src:url('fonts/barlow-condensed-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:500;font-style:normal;font-display:swap;src:url('fonts/ibm-plex-sans-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:600;font-style:normal;font-display:swap;src:url('fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-style:normal;font-display:swap;src:url('fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2')}
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Concept : application mobile en trois zones (barre véhicule collante, écran qui défile, barre de 5 onglets fixe). Les jauges et les barres d'usure à segments rappellent un tableau de bord d'atelier. */
:root{
  --bg:#ECEFEE; --surface:#F8FAF9; --surface2:#E1E7E5; --ink:#0F2A2E; --ink2:#506567; --line:#CBD4D2;
  --accent:#1D5FD1; --accent-ink:#FFFFFF;
  --ok:#1B7F46; --warn:#A85F00; --crit:#B52A1B; --onc:#FFFFFF;
  --c1:#1D5FD1; --c2:#C28A1C; --c3:#7E9091;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1719; --surface:#122427; --surface2:#1A3033; --ink:#E6EFEE; --ink2:#93A9AA; --line:#274044;
    --accent:#6FA4FF; --accent-ink:#0B1719;
    --ok:#4CC37F; --warn:#F0A537; --crit:#FF7B69; --onc:#08130F;
    --c1:#6FA4FF; --c2:#E3B04B; --c3:#8FA5A6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1719; --surface:#122427; --surface2:#1A3033; --ink:#E6EFEE; --ink2:#93A9AA; --line:#274044;
  --accent:#6FA4FF; --accent-ink:#0B1719;
  --ok:#4CC37F; --warn:#F0A537; --crit:#FF7B69; --onc:#08130F;
  --c1:#6FA4FF; --c2:#E3B04B; --c3:#8FA5A6; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
small{font-size:12px;color:var(--ink2)}
.muted{color:var(--ink2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.grow b{font-weight:600;overflow-wrap:anywhere}
.s-ok{--c:var(--ok)} .s-warn{--c:var(--warn)} .s-crit{--c:var(--crit)} .s-na{--c:var(--ink2)}

/* barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.word{font-family:var(--f-display);font-size:22px;letter-spacing:.14em;line-height:1;display:flex;gap:6px;white-space:nowrap}
.word b{font-weight:700}.word span{font-weight:500;color:var(--ink2)}
.vchip{display:flex;align-items:center;gap:8px;min-width:0;max-width:62%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 10px 6px 14px;min-height:40px}
.vchip .vn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.plate{display:inline-block;font:500 12px/1 var(--f-mono);letter-spacing:.08em;background:#F4F4EE;color:#111;border:2px solid #111;border-radius:5px;padding:4px 7px;white-space:nowrap}

main{display:flex;flex-direction:column;gap:22px;padding-block:18px calc(92px + env(safe-area-inset-bottom,0px))}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lbl{font:600 12px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.title{font:700 30px/1.05 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:58px;width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.list>.row:first-child,.list>:first-child>.row:first-child{border-top:0}
button.row:active{background:var(--surface2)}
.pct{font:600 15px/1 var(--f-mono);color:var(--c,var(--ink2));min-width:44px;text-align:right}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.sb{display:grid;grid-template-columns:repeat(10,5px);gap:2px;height:10px;flex:none}
.sb i{background:var(--line);border-radius:1px}.sb i.on{background:var(--c)}
.chip{display:inline-flex;align-items:center;font:600 11px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:999px;color:var(--c,var(--ink2));background:color-mix(in srgb,var(--c,var(--ink2)) 15%,transparent);white-space:nowrap}
.k-diy{--c:var(--accent)}.k-pro{--c:var(--ink2)}
.empty{padding:18px 14px;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.danger{background:transparent;color:var(--crit);border-color:color-mix(in srgb,var(--crit) 50%,transparent)}
.btn.full{width:100%}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;min-height:38px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* cockpit */
.hero{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.hinfo{display:flex;flex-direction:column;gap:8px;min-width:0;align-items:flex-start;flex:1}
.hrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hinfo h1{font:700 32px/1 var(--f-display);overflow-wrap:anywhere;text-wrap:balance}
.odo{display:flex;align-items:baseline;gap:6px;font-family:var(--f-display);font-size:18px;color:var(--ink2)}
.odo .mono{font:600 30px/1 var(--f-display);color:var(--ink);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.hg{flex:none;width:158px;display:flex;flex-direction:column;align-items:center;gap:6px}
.gauge{width:100%;height:auto;display:block}
.g-num{font-family:var(--f-display);font-weight:700;font-size:44px;fill:var(--ink)}
.g-lbl{font-family:var(--f-body);font-weight:600;font-size:10px;letter-spacing:.12em;fill:var(--ink2)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;padding:8px 4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:13px;font-weight:600}
.qa svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mx{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mx>div{background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mx b{font:700 22px/1.05 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.note{background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:14px}

/* rayon x */
.car{width:100%;height:auto;display:block}
.car .body{fill:var(--surface2);stroke:var(--ink2);stroke-width:2;stroke-linejoin:round}
.car .tire{fill:var(--ink2)}.car .rim{fill:var(--surface)}.car .ground{stroke:var(--line);stroke-width:2}
.hot{cursor:pointer}.hot circle{fill:var(--c);stroke:var(--bg);stroke-width:3}
.hot text{font:700 14px var(--f-display);fill:var(--onc)}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--c,var(--ink2));color:var(--onc);font:700 14px/1 var(--f-display);flex:none}
.sub{padding:8px 14px 4px;font:600 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);background:var(--surface2);border-top:1px solid var(--line)}
.sysb>.row:first-child{border-top:1px solid var(--line)}
.list>.sysb:first-child>.row:first-child{border-top:0}
.sysb .row .sb{grid-template-columns:repeat(10,4px)}

/* budget */
.prk{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.prk b{font:700 52px/1 var(--f-display);font-variant-numeric:tabular-nums}
.prk span{color:var(--ink2)}
.chart{width:100%;height:auto;display:block}
.chart .ax{font:500 9px var(--f-mono);fill:var(--ink2)}
.keys{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.keys i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tco .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.tco .bar i{display:block;height:100%;background:var(--accent)}
.tco .row{align-items:flex-start;min-height:0}

/* formulaires et feuilles */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(4,14,16,.58)}
.panel{position:relative;width:100%;max-width:560px;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.ph,.pb,.pf{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:6px;padding-bottom:6px}
.ph h2{font:700 24px/1.1 var(--f-display);overflow-wrap:anywhere}
.x{width:44px;height:44px;border:0;background:none;font-size:28px;line-height:1;color:var(--ink2)}
.pb{overflow:auto;display:flex;flex-direction:column;gap:12px;padding-top:4px;padding-bottom:16px;overscroll-behavior:contain}
.pf{padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;font-weight:500;color:var(--ink2)}
.fld input,.fld select,.fld textarea{width:100%;min-width:0;max-width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.fld textarea{min-height:76px;resize:vertical}
.chk{display:flex;align-items:center;gap:10px;min-height:42px}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.err{color:var(--crit);font-size:14px;font-weight:500}
.verd{display:flex;flex-direction:column;gap:6px;font-size:14px}
.verd div{display:flex;gap:8px;align-items:flex-start}
.pdet{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--bg)}
.pnum{font:700 54px/1 var(--f-display);color:var(--c);font-variant-numeric:tabular-nums}
.pnum small{font-size:22px;color:var(--c)}
.calc{margin:0;padding-left:18px;color:var(--ink2);font-size:13px;display:flex;flex-direction:column;gap:3px}
details{border:1px solid var(--line);border-radius:10px;padding:0 12px}
summary{min-height:46px;display:flex;align-items:center;font-weight:600;cursor:pointer}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:6px}
.stk{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stk input{width:84px;flex:none}
.chrono{display:flex;align-items:center;gap:12px}
.chrono .mono{font-size:22px}
.qty{display:flex;align-items:center;gap:8px;flex:none}
.qty b{min-width:26px;text-align:center;font:600 16px var(--f-mono)}
.qbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1}
.link{background:none;border:0;padding:0;text-align:left}

/* onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;background:none;border:0;border-radius:10px;font-size:11.5px;font-weight:600;color:var(--ink2);min-width:0}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;max-width:90%;text-align:center}
@media (prefers-reduced-motion:no-preference){.sb i,.pct{transition:background .3s}}
</style>

<header class="top" id="top">
  <div class="word"><b>APEX</b><span>GARAGE</span></div>
  <button class="vchip" id="vchip" data-a="vehicles" aria-label="Changer de véhicule"></button>
</header>
<main id="main" aria-live="polite"></main>
<nav class="tabs" aria-label="Navigation principale"><div class="tabs-in" id="tabs"></div></nav>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>

 {id:'moteur',n:'Moteur',subs:['Lubrification','Distribution','Refroidissement','Admission & carburant','Allumage','Accessoires']},

['Amortisseurs avant','chassis','Suspension',80000,96],['Amortisseurs arrière','chassis','Suspension',80000,96],

var FUELS=['Diesel','Essence','GPL','Hybride','Électrique'];

var STKC=['Huile','Filtre','Freinage','Liquide','Ampoule','Visserie','Pneu','Autre'];
var LBL={ok:'Bon',warn:'À prévoir',crit:'Critique',na:'À renseigner'};
var MONS=['jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov','déc'];
var LS='apexgarage.v1';
var ICON={

 budget:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/>',

 fuel:'<path d="M5 20V6a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v14M4 20h11"/><path d="M14 9h2l2 2v6a1.5 1.5 0 0 0 3 0v-5l-3-3"/>',
 coin:'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4"/>',
 volt:'<path d="M13 3L5 13h6l-1 8 8-10h-6z"/>'
};
function ico(n){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[n]+'</svg>';}
var TABS=[['cockpit','Cockpit'],['xray','Rayon X'],['maint','Entretien'],['budget','Budget'],['shop','Atelier']];

/* codes défauts courants : [titre, causes probables, gravité 1-3] */
var DTC={
P0100:['Débitmètre d’air (MAF) : circuit','Débitmètre encrassé ou défaillant, connecteur, prise d’air',2],

/* ============ usure, santé, calculs ============ */
function st(h){return h==null?'na':h<25?'crit':h<60?'warn':'ok';}
function wear(p,v){
  var sev=SEV[v.usage]||1, wk=null, wt=null, kmSince=null, days=null;
  if(p.ikm>0&&p.km!=null){kmSince=Math.max(0,v.odo-p.km);wk=kmSince*sev/p.ikm;}
  if(p.imo>0&&p.date){days=Math.max(0,daysBetween(p.date,today()));wt=days/(p.imo*30.4375);}
  if(wk==null&&wt==null)return null;
  var w=Math.max(wk==null?0:wk,wt==null?0:wt);
  return {h:Math.max(0,Math.min(100,Math.round(100*(1-w)))),w:w,wk:wk,wt:wt,sev:sev,kmSince:kmSince,days:days,
    remKm:wk!=null?Math.round(p.ikm/sev-kmSince):null, remD:wt!=null?Math.round(p.imo*30.4375-days):null};
}
function remTxt(w){
  var a=[];
  if(w.remKm!=null)a.push(w.remKm>=0?fnum(w.remKm)+' km restants':'dépassé de '+fnum(-w.remKm)+' km');
  if(w.remD!=null)a.push(w.remD>=0?fdays(w.remD)+' restants':'dépassé de '+fdays(-w.remD));
  return a.join(' · ');
}
function vScore(v){
  var hs=v.parts.map(function(p){return wear(p,v);}).filter(Boolean).map(function(w){return w.h;});
  if(!hs.length)return null;
  var mean=hs.reduce(function(a,b){return a+b;},0)/hs.length;
  return Math.round(0.7*mean+0.3*Math.min.apply(null,hs));
}
function sScore(v,id){
  var hs=v.parts.filter(function(p){return p.sys===id;}).map(function(p){return wear(p,v);}).filter(Boolean).map(function(w){return w.h;});
  return hs.length?Math.round(hs.reduce(function(a,b){return a+b;},0)/hs.length):null;
}
function alerts(v){
  return v.parts.map(function(p){return {p:p,w:wear(p,v)};}).filter(function(x){return x.w&&x.w.h<60;}).sort(function(a,b){return a.w.h-b.w.h;});
}
function fuelCalc(v){
  var f=v.fuels.slice().sort(function(a,b){return a.km-b.km||String(a.date).localeCompare(b.date);});
  var last=null,lit=0,out=[];
  f.forEach(function(e){
    var cons=null,segL=null,segK=null;
    if(last!=null)lit+=e.qty;
    if(e.full){
      if(last!=null&&e.km>last){segL=lit;segK=e.km-last;cons=lit/segK*100;}
      last=e.km;lit=0;
    }
    out.push({e:e,cons:cons,segL:segL,segK:segK});
  });
  return out;
}
function fuelAvg(v){
  var L=0,K=0;
  fuelCalc(v).forEach(function(x){if(x.cons!=null){L+=x.segL;K+=x.segK;}});
  return K>0?L/K*100:null;
}
function costRows(v){
  var r=[];
  v.fuels.forEach(function(e){r.push({date:e.date,c:'fuel',a:+e.total||0});});
  v.logs.forEach(function(l){r.push({date:l.date,c:'maint',a:(+l.costParts||0)+(+l.costLabor||0)});});
  v.exps.forEach(function(x){r.push({date:x.date,c:'other',a:+x.amount||0,sub:x.cat});});
  return r;
}
function kmAt(v,date){
  var pts=[].concat(v.fuels.map(function(e){return [e.date,e.km];}),v.logs.map(function(e){return [e.date,e.km];}),v.tests.map(function(e){return [e.date,e.km];}))
    .filter(function(p){return p[1]!=null;}).sort(function(a,b){return a[0].localeCompare(b[0]);});
  var r=null;pts.forEach(function(p){if(p[0]<=date)r=p[1];});
  return r!=null?r:(pts.length?pts[0][1]:v.kmStart);
}
function tco(v,per){
  var from=per==='12'?addMonths(today(),-12):'0000-00-00';
  var rows=costRows(v).filter(function(r){return r.date>=from;});
  var t={fuel:0,maint:0,ins:0,other:0,depr:0};
  rows.forEach(function(r){
    if(r.c==='fuel')t.fuel+=r.a;else if(r.c==='maint')t.maint+=r.a;
    else if(['Assurance','Vignette & taxes','Contrôle technique'].indexOf(r.sub)>=0)t.ins+=r.a;else t.other+=r.a;
  });
  var kmAll=v.odo-v.kmStart;
  var km=per==='12'?v.odo-kmAt(v,from):kmAll;
  if(v.buy>0&&v.value>0&&v.buy>v.value){
    t.depr=per==='12'?(kmAll>0?(v.buy-v.value)*Math.min(1,Math.max(0,km)/kmAll):0):(v.buy-v.value);
  }
  t.total=t.fuel+t.maint+t.ins+t.other+t.depr;
  t.km=km;t.prk=km>0?t.total/km:null;
  return t;
}
function monthly(v){
  var now=new Date(),keys=[],i;
  for(i=11;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);keys.push(d.getFullYear()+'-'+pad(d.getMonth()+1));}
  var m={};keys.forEach(function(k){m[k]={k:k,fuel:0,maint:0,other:0};});
  costRows(v).forEach(function(r){var k=r.date.slice(0,7);if(m[k])m[k][r.c]+=r.a;});
  return keys.map(function(k){return m[k];});
}
function niceMax(x){var p=Math.pow(10,Math.floor(Math.log10(x))),n=x/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p;}
function kfmt(v){return v>=1000?fnum(v/1000,v%1000?1:0)+' k':fnum(v);}

function judge(t){
  var r=[];

  if(t.crank!=null)r.push(t.crank>=10?['ok','Au démarrage','La tension tient pendant le lancement.']:t.crank>=9.6?['warn','Au démarrage','Limite basse : batterie ou connexions à surveiller.']:['crit','Au démarrage','Chute trop forte : batterie fatiguée, cosses ou démarreur à contrôler.']);
  if(t.run!=null)r.push(t.run>=13.7&&t.run<=14.8?['ok','Moteur tournant','Alternateur : charge normale.']:(t.run>=13.2&&t.run<13.7)?['warn','Moteur tournant','Charge un peu faible : courroie, alternateur ou câbles.']:(t.run>14.8&&t.run<=15.2)?['warn','Moteur tournant','Charge un peu haute : régulateur à surveiller.']:t.run<13.2?['crit','Moteur tournant','Pas de charge suffisante : alternateur, courroie ou câbles.']:['crit','Moteur tournant','Surcharge : régulateur d’alternateur à faire contrôler.']);
  if(t.sec!=null)r.push(t.sec<=1?['ok','Temps de lancement','Démarrage rapide.']:t.sec<=2?['warn','Temps de lancement','Un peu long : surveille batterie, bougies ou alimentation.']:['crit','Temps de lancement','Trop long : démarreur, allumage ou alimentation en carburant à vérifier.']);
  return r;
}
function worst(r){return r.some(function(x){return x[0]==='crit';})?'crit':r.some(function(x){return x[0]==='warn';})?'warn':r.length?'ok':'na';}
function decodeVin(x){
  x=x.trim().toUpperCase();
  if(x.length!==17)return 'Un VIN contient 17 caractères ('+x.length+' saisis).';
  if(/[IOQ]/.test(x)||!/^[A-Z0-9]{17}$/.test(x))return 'VIN invalide : lettres I, O et Q interdites, pas de symboles.';
  var c=x[0],reg=/[A-H]/.test(c)?'Afrique':/[J-R]/.test(c)?'Asie':/[S-Z]/.test(c)?'Europe':/[1-5]/.test(c)?'Amérique du Nord':/[6-7]/.test(c)?'Océanie':'Amérique du Sud';
  var i='ABCDEFGHJKLMNPRSTVWXY123456789'.indexOf(x[9]);
  var yr=i<0?'inconnue':(2010+i)+' ou '+(1980+i);
  return 'Région : '+reg+'. Code constructeur (WMI) : '+x.slice(0,3)+'. Année modèle d’après le 10e caractère : '+yr+'.';
}
function decodeDtc(code){
  var c=code.trim().toUpperCase();
  if(!/^[PBCU][0-9A-F]{4}$/.test(c))return null;
  if(DTC[c])return {code:c,t:DTC[c][0],cause:DTC[c][1],g:DTC[c][2],known:true};
  var grp={P:'Groupe motopropulseur',B:'Carrosserie',C:'Châssis',U:'Réseau de communication'}[c[0]];
  var typ={'0':'code générique (norme SAE)','1':'code propre au constructeur','2':'code générique ou constructeur','3':'code générique ou constructeur'}[c[1]]||'code';
  var sub='';
  if(c[0]==='P'){sub={'1':'carburant et air','2':'carburant et air (injection)','3':'allumage ou ratés d’allumage','4':'contrôle des émissions','5':'vitesse et ralenti','6':'calculateur et sorties','7':'transmission','8':'transmission','9':'transmission'}[c[2]]||'';}
  return {code:c,t:grp+' : '+typ+(sub?', '+sub:''),cause:'Code absent de la liste intégrée. Cherche sa définition pour ta marque et ton modèle.',g:2,known:false};
}

      await DBC.doc('meta').set(clone({u:S.u,set:S.set,active:S.active,order:S.vehicles.map(function(v){return v.id;}),stock:S.stock}));
    }
    var ids=Object.keys(dirty.v);
    for(var i=0;i<ids.length;i++){
      var v=S.vehicles.find(function(x){return x.id===ids[i];});
      delete dirty.v[ids[i]];
      if(v)await DBC.doc('veh_'+v.id).set(clone(v));
    }
    var gone=Object.keys(dirty.gone);
    for(var j=0;j<gone.length;j++){delete dirty.gone[gone[j]];await DBC.doc('veh_'+gone[j]).delete();}
    syncState='ok';
  }catch(e){
    syncState='err';dirty.meta=true;S.vehicles.forEach(function(v){dirty.v[v.id]=1;});
    clearTimeout(timer);timer=setTimeout(flush,20000);
  }
  flushing=false;
  if(dirty.meta||Object.keys(dirty.v).length||Object.keys(dirty.gone).length)queueSync();
  if(ui.tab==='shop'&&ui.shop==='data')render();
}
function pushAll(){dirty.meta=true;S.vehicles.forEach(function(v){dirty.v[v.id]=1;});queueSync();}
function commit(vid){
  S.u=Date.now();dirty.meta=true;if(vid)dirty.v[vid]=1;
  saveLocal();queueSync();render();
}
function rebuild(docs){
  var m=docs.meta;
  return {ver:2,u:m.u||0,set:m.set||{cur:'DA'},active:m.active||null,
    vehicles:(m.order||[]).map(function(id){return docs['veh_'+id];}).filter(Boolean).map(normV),stock:m.stock||[]};
}
async function initSync(){
  try{
    var C=window.claude;if(!C||!C.use)return;
    var db=await C.use('db'),user=await C.use('user');
    var id=user?await user.id():null;
    if(!db||!id){syncState='local';return;}
    DBC=db.collection('data/users/'+id);
    var snap=await DBC.get(),docs={};
    snap.docs.forEach(function(d){docs[d.id]=clone(d.data());});
    if(docs.meta){
      var r=rebuild(docs);
      if(r.u>S.u){S=r;saveLocal();syncState='ok';}
      else if(S.u>r.u){pushAll();}
      else syncState='ok';
    }else{pushAll();}
    if(syncState!=='ok')syncState='ok';
    render();
  }catch(e){syncState='local';DBC=null;}
}

function fuelSheet(id){
  var v=cur(),e=id?v.fuels.find(function(x){return x.id===id;}):null,ev=v.fuel==='Électrique',u=ev?'kWh':'L';
  var lastP=v.fuels.length?v.fuels.slice().sort(function(a,b){return b.date.localeCompare(a.date);})[0].ppl:null;
  var h='<div class="g2">'+fD('date','Date',e?e.date:today())+fN('km','Kilométrage',e?e.km:v.odo)+'</div>'+
    '<div class="g2">'+fN('qty',(ev?'Énergie (kWh)':'Litres'),e&&e.qty)+fN('ppl','Prix par '+u,e?e.ppl:lastP)+'</div>'+
    fN('total','Total payé ('+esc(S.set.cur)+')',e&&e.total)+
    '<label class="chk"><input type="checkbox" id="f_full"'+(!e||e.full?' checked':'')+'><span>'+(ev?'Charge complète':'Plein complet (réservoir rempli)')+'</span></label>'+
    fN('dash','Conso affichée au tableau de bord ('+u+'/100, facultatif)',e&&e.dash)+fT('note','Station ou note',e&&e.note)+(e?delBtn('fuel',e.id):'');
  sheet(e?'Modifier le plein':'Nouveau plein',h,function(){
    var q=gn('qty'),ppl=gn('ppl'),tot=gn('total'),km=gn('km');
    if(!(q>0))return ferr('Saisis la quantité.');
    if(km==null||km<0)return ferr('Saisis le kilométrage.');
    if(tot==null&&ppl!=null)tot=Math.round(q*ppl*100)/100;
    if(!(tot>=0)||tot==null)return ferr('Saisis le prix ou le total payé.');
    if(ppl==null)ppl=Math.round(tot/q*100)/100;
    var o={date:g('date')||today(),km:km,qty:q,ppl:ppl,total:tot,full:$('#f_full').checked,dash:gn('dash'),note:g('note').trim()};
    if(e)Object.assign(e,o);else v.fuels.push(Object.assign({id:uid()},o));
    if(km>v.odo)v.odo=km;
    commit(v.id);
  });
  var last='';
  function recalc(src){
    var q=gn('qty'),p=gn('ppl'),t=gn('total');
    if(src==='total'){if(q>0&&t!=null)$('#f_ppl').value=Math.round(t/q*100)/100;}
    else if(q>0&&p!=null)$('#f_total').value=Math.round(q*p*100)/100;
  }
  ['qty','ppl'].forEach(function(k){$('#f_'+k).addEventListener('input',function(){recalc(k);});});
  $('#f_total').addEventListener('input',function(){recalc('total');});
}
function expSheet(id){
  var v=cur(),e=id?v.exps.find(function(x){return x.id===id;}):null;
  sheet(e?'Modifier la dépense':'Nouvelle dépense',
    '<div class="g2">'+fD('date','Date',e?e.date:today())+fN('amount','Montant ('+esc(S.set.cur)+')',e&&e.amount)+'</div>'+fS('cat','Catégorie',EXPC,e?e.cat:'Assurance')+fT('note','Note',e&&e.note)+(e?delBtn('exp',e.id):''),
    function(){
      var a=gn('amount');if(!(a>=0)||a==null)return ferr('Saisis le montant.');
      var o={date:g('date')||today(),amount:a,cat:g('cat'),note:g('note').trim()};
      if(e)Object.assign(e,o);else v.exps.push(Object.assign({id:uid()},o));
      commit(v.id);
    });
}
function testSheet(id){
  var v=cur(),t=id?v.tests.find(function(x){return x.id===id;}):null;
  var h='<p class="muted" style="font-size:14px">Mesure à froid si possible. Les seuils sont des repères usuels pour une batterie 12 V au plomb, à confirmer avec un testeur de batterie.</p>'+
    '<div class="g2">'+fD('date','Date',t?t.date:today())+fN('km','Kilométrage',t?t.km:v.odo)+'</div>'+
    '<div class="g2">'+fN('rest','Repos, moteur coupé (V)',t&&t.rest,'placeholder="12,6"')+fN('crank','Plus bas au démarrage (V)',t&&t.crank,'placeholder="10,2"')+'</div>'+
    '<div class="g2">'+fN('run','Moteur tournant (V)',t&&t.run,'placeholder="14,2"')+fN('sec','Durée de lancement (s)',t&&t.sec,'placeholder="0,8"')+'</div>'+
    '<div class="verd" id="verd" aria-live="polite"></div>'+fT('note','Note',t&&t.note)+(t?delBtn('test',t.id):'');
  sheet(t?'Test de démarrage':'Nouveau test de démarrage',h,function(){
    var o=read();if(o.rest==null&&o.crank==null&&o.run==null&&o.sec==null)return ferr('Saisis au moins une mesure.');
    o.date=g('date')||today();o.km=gn('km');o.note=g('note').trim();
    if(t)Object.assign(t,o);else v.tests.push(Object.assign({id:uid()},o));
    if(o.km>v.odo)v.odo=o.km;
    commit(v.id);
  });
  function read(){return {rest:gn('rest'),crank:gn('crank'),run:gn('run'),sec:gn('sec')};}
  function upd(){
    var r=judge(read()),el=$('#verd');
    el.innerHTML=r.map(function(x){return '<div class="s-'+x[0]+'"><span class="chip">'+({ok:'OK',warn:'Attention',crit:'Anormal'}[x[0]])+'</span><span><b>'+x[1]+'</b> · '+x[2]+'</span></div>';}).join('');
    var a=gn('rest'),b=gn('crank');if(a!=null&&b!=null)el.innerHTML+='<small>Chute de tension au lancement : '+fnum(a-b,2)+' V</small>';
  }
  ['rest','crank','run','sec'].forEach(function(k){$('#f_'+k).addEventListener('input',upd);});upd();
}
function stockSheet(id){
  var i=id?S.stock.find(function(x){return x.id===id;}):null;
  sheet(i?'Modifier l’article':'Nouvel article',
    fT('name','Nom',i&&i.name,'placeholder="Huile 5W30"')+'<div class="g2">'+fS('cat','Catégorie',STKC,i?i.cat:'Huile')+fT('unit','Unité',i?i.unit:'pièce','placeholder="bidon 5 L"')+'</div>'+
    '<div class="g2">'+fN('qty','Quantité en stock',i?i.qty:1)+fN('min','Alerte quand il en reste ≤',i?i.min:1)+'</div>'+fT('note','Note',i&&i.note)+(i?delBtn('stock',i.id):''),
    function(){
      var name=g('name').trim();if(!name)return ferr('Donne un nom à l’article.');
      var o={name:name,cat:g('cat'),unit:g('unit').trim()||'pièce',qty:Math.max(0,gn('qty')||0),min:Math.max(0,gn('min')||0),note:g('note').trim()};
      if(i){Object.assign(i,o);delete i.ex;}else S.stock.push(Object.assign({id:uid()},o));
      commit();
    });
}
function importFile(ev){
  var f=ev.target.files&&ev.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);if(!d||!Array.isArray(d.vehicles))throw new Error('format');
      d.vehicles=d.vehicles.map(normV);d.stock=d.stock||[];d.set=d.set||{cur:'DA'};
      sheet('Importer la sauvegarde','<p>Cette sauvegarde contient <b>'+d.vehicles.length+' véhicule'+(d.vehicles.length>1?'s':'')+'</b> et <b>'+d.stock.length+' article'+(d.stock.length>1?'s':'')+'</b> en stock. Elle remplace les données actuelles de cet appareil et de ton compte.</p>',function(){
        S=d;S.ver=2;S.active=S.active||(S.vehicles[0]&&S.vehicles[0].id)||null;pushAll();commit();toast('Sauvegarde importée');
      },'Remplacer mes données');
    }catch(e){toast('Fichier de sauvegarde non reconnu');}
  };
  r.readAsText(f);
}
async function exportData(){
  var name='apexgarage-sauvegarde-'+today()+'.json',data=JSON.stringify(S,null,1);
  try{
    if(window.AndroidBridge&&window.AndroidBridge.saveFile){
      var where=window.AndroidBridge.saveFile(name,data);
      toast(where?'Sauvegarde enregistrée : '+where:'Export impossible');return;
    }
    var C=window.claude,dl=(C&&C.use)?await C.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:data});toast('Sauvegarde exportée');return;}
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Sauvegarde exportée');
  }catch(e){if(!e||e.code!=='declined')toast('Export impossible');}
}
function doDelete(k,id){
  var v=cur();
  if(k==='fuel')v.fuels=v.fuels.filter(function(x){return x.id!==id;});
  else if(k==='exp')v.exps=v.exps.filter(function(x){return x.id!==id;});
  else if(k==='log')v.logs=v.logs.filter(function(x){return x.id!==id;});
  else if(k==='test')v.tests=v.tests.filter(function(x){return x.id!==id;});
  else if(k==='dtc')v.dtcs=v.dtcs.filter(function(x){return x.id!==id;});
  else if(k==='part')v.parts=v.parts.filter(function(x){return x.id!==id;});
  else if(k==='stock'){S.stock=S.stock.filter(function(x){return x.id!==id;});closeSheet();commit();return;}
  else if(k==='veh'){
    var gone=S.vehicles.find(function(x){return x.id===id;});
    S.vehicles=S.vehicles.filter(function(x){return x.id!==id;});dirty.gone[id]=1;delete dirty.v[id];
    if(gone&&gone.example)S.stock=S.stock.filter(function(i){return !i.ex;});
    if(S.active===id)S.active=S.vehicles[0]?S.vehicles[0].id:null;
    closeSheet();commit();return;
  }
  else if(k==='all'){
    S.vehicles.forEach(function(x){dirty.gone[x.id]=1;});
    var keep=S.set;S=emptyState();S.set=keep;closeSheet();commit();toast('Données effacées');return;
  }
  closeSheet();commit(v.id);
}

/* ============ actions ============ */
var A={
 tab:function(el){ui.tab=el.dataset.v;render();window.scrollTo(0,0);},
 close:function(){closeSheet();},
 save:function(){if(!sheetSave)return;var r=sheetSave();if(r!==false)closeSheet();},
 vehicles:function(){vehiclesSheet();},
 pick:function(el){S.active=el.dataset.id;closeSheet();ui.open=null;commit();},
 newVeh:function(){closeSheet();vehSheet(null);},
 editVeh:function(){var v=cur();closeSheet();vehSheet(v.id);},
 odo:function(){odoSheet();},
 sys:function(el){ui.open=ui.open===el.dataset.id?null:el.dataset.id;if(ui.tab!=='xray')ui.tab='xray';render();var t=$('.sysb [aria-expanded="true"]');if(t)t.scrollIntoView({block:'nearest',behavior:'smooth'});},
 part:function(el){partSheet(el.dataset.id);},
 newPart:function(el){partSheet(null,el.dataset.sys);},
 loadPre:function(){var v=cur();loadPre(v,null);commit(v.id);toast(PRE.length+' pièces ajoutées');},
 renewNow:function(){var v=cur(),p=v.parts.find(function(x){return x.id===ctx.part;});if(!p)return;p.date=today();p.km=v.odo;closeSheet();commit(v.id);toast(p.name+' remise à neuf');},
 logForPart:function(){var id=ctx.part;closeSheet();logSheet([id]);},
 log:function(){logSheet(null);},
 logView:function(el){logView(el.dataset.id);},
 addStep:function(){var i=$('#f_step'),t=i.value.trim();if(!t)return;var l=document.createElement('label');l.className='chk';var c=document.createElement('input');c.type='checkbox';var s=document.createElement('span');s.textContent=t;l.appendChild(c);l.appendChild(s);$('#steps').appendChild(l);i.value='';i.focus();},
 fuel:function(el){fuelSheet(el.dataset.id);},
 exp:function(el){expSheet(el.dataset.id);},
 test:function(el){testSheet(el.dataset.id);},
 per:function(el){ui.per=el.dataset.v;render();},
 more:function(el){ui.more[el.dataset.k]=true;render();},
 shopTab:function(el){ui.shop=el.dataset.v;render();},
 goStock:function(){ui.tab='shop';ui.shop='stock';render();window.scrollTo(0,0);},
 stockEdit:function(el){stockSheet(el.dataset.id);},
 stk:function(el){var i=S.stock.find(function(x){return x.id===el.dataset.id;});if(!i)return;i.qty=Math.max(0,i.qty+Number(el.dataset.d));delete i.ex;commit();},
 dtcFind:function(){
   var r=decodeDtc($('#f_dtc').value),o=$('#dtcout');ctx.dtc=r;
   if(!r){o.innerHTML='<p class="err">Code non valide. Format attendu : une lettre (P, B, C ou U) suivie de 4 chiffres, par exemple P0420.</p>';return;}
   var gl=['','Information : à surveiller','À faire contrôler bientôt','Urgent : évite de rouler longtemps'][r.g];
   o.innerHTML='<div class="s-'+(r.g===3?'crit':r.g===2?'warn':'ok')+'" style="display:flex;flex-direction:column;gap:8px"><span class="chip" style="align-self:flex-start">'+esc(gl)+'</span><p><b class="mono">'+esc(r.code)+'</b> · '+esc(r.t)+'</p><p class="muted" style="font-size:14px">Causes fréquentes : '+esc(r.cause)+'</p><button class="btn ghost sm" data-a="dtcSave" style="align-self:flex-start">Ajouter à l’historique</button></div>';
 },
 dtcSave:function(){var v=cur();if(!ctx.dtc)return;v.dtcs.push({id:uid(),code:ctx.dtc.code,date:today(),km:v.odo,cleared:false});ctx.dtc=null;commit(v.id);toast('Code ajouté à l’historique');},
 dtcToggle:function(el){var v=cur(),d=v.dtcs.find(function(x){return x.id===el.dataset.id;});if(d){d.cleared=!d.cleared;commit(v.id);}},
 export:function(){exportData();},
 del:function(el){
   if(!el.dataset.armed){el.dataset.armed='1';el.dataset.t=el.textContent;el.textContent='Confirmer la suppression';setTimeout(function(){if(el.isConnected&&el.dataset.armed){delete el.dataset.armed;el.textContent=el.dataset.t;}},3500);return;}
   doDelete(el.dataset.k,el.dataset.id);
 }
};
document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(!el)return;var f=A[el.dataset.a];if(f){e.preventDefault();f(el,e);}});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g.hot')){e.preventDefault();A.sys(e.target);}
});
$('#tabs').innerHTML=TABS.map(function(t){return '<button class="tab" data-a="tab" data-v="'+t[0]+'">'+ico(t[0])+'<span>'+t[1]+'</span></button>';}).join('');

window.__back=function(){
  if(!$('#sheet').hidden){closeSheet();return true;}
  if(ui.tab!=='cockpit'){ui.tab='cockpit';render();window.scrollTo(0,0);return true;}
  return false;
};
/* ============ démarrage ============ */
var loaded=loadLocal();
if(loaded&&Array.isArray(loaded.vehicles)){S=loaded;S.vehicles=S.vehicles.map(normV);S.stock=S.stock||[];S.set=S.set||{cur:'DA'};}
else S=seed();
render();
initSync();
})();
</script>
