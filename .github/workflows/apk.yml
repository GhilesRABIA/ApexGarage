name: Fabriquer l'APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Fabriquer l'APK signé
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk ApexGarage.apk

      - name: Garder l'APK dans cette exécution
        uses: actions/upload-artifact@v4
        with:
          name: ApexGarage-apk
          path: ApexGarage.apk

      - name: Publier l'APK en téléchargement direct
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: ApexGarage (dernière version)
          body: "Dernière version fabriquée : numéro ${{ github.run_number }}. Télécharge ApexGarage.apk puis installe-le sur ton téléphone."
          files: ApexGarage.apk
          target_commitish: ${{ github.sha }}
