name: Fabriquer l'APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    # Version fixe d'Ubuntu : le kit Android est déjà installé dessus.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer le kit Android
        run: |
          echo "::notice title=Environnement::$(. /etc/os-release; echo "$PRETTY_NAME") | ANDROID_HOME=${ANDROID_HOME:-vide} | platforms=$(ls "${ANDROID_HOME:-/inexistant}/platforms" 2>&1 | tr '\n' ' ') | build-tools=$(ls "${ANDROID_HOME:-/inexistant}/build-tools" 2>&1 | tr '\n' ' ')"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Fabriquer l'APK signé
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon 2>&1 | tee build.log

      - name: Résumé de l'erreur
        if: failure()
        run: |
          if [ -f build.log ]; then
            cles=$(grep -E "error:|^e: |FAILURE:|What went wrong|Execution failed|Caused by|Could not|not found|Unresolved|icense" build.log | head -25 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            echo "::error title=Erreur de fabrication::${cles:0:3800}"
            fin=$(tail -n 25 build.log | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            echo "::error title=Fin du journal::${fin:0:3800}"
          fi

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk ApexGarage.apk

      - name: Garder l'APK dans cette exécution
        uses: actions/upload-artifact@v4
        with:
          name: ApexGarage-apk
          path: ApexGarage.apk

      - name: Publier l'APK en téléchargement direct
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: ApexGarage (dernière version)
          body: "Dernière version fabriquée : numéro ${{ github.run_number }}. Télécharge ApexGarage.apk puis installe-le sur ton téléphone."
          files: ApexGarage.apk
          target_commitish: ${{ github.sha }}
